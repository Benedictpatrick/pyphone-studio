    <!-- Pyodide WASM Engine CDN. Deferred so it never blocks first paint on
         slow mobile connections — pyodideService.js already has its own
         fallback that dynamically injects this script if it isn't ready
         yet, so a blocking synchronous <script> here only cost startup time. -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js" defer></script>
    <!-- Service worker registration is handled exclusively by vite-plugin-pwa's
         auto-injected registerSW.js (registerType: 'autoUpdate'). A second,
         hand-written registration here used to force a full page reload via
         its own controllerchange listener — including on a user's very first
         visit, because the workbox config claims clients immediately. That
         meant new/updated users could get their in-progress Pyodide boot
         (15-20s on mobile) silently restarted from zero mid-load. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('error', (e) => {
        const root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = `<div style="padding:20px;font-family:sans-serif;color:#f44"><h2>Error</h2><pre style="white-space:pre-wrap">${e.error?.stack || e.message}</pre></div>`;
        }
      });
      window.addEventListener('unhandledrejection', (e) => {
        const root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = `<div style="padding:20px;font-family:sans-serif;color:#f44"><h2>Error</h2><pre style="white-space:pre-wrap">${e.reason?.stack || e.reason}</pre></div>`;
        }
      });
    </script>
  </body>
